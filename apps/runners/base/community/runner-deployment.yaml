# =============================================================================
# Flavor: community (actions-runner-controller / summerwind, legacy)
# =============================================================================
# RunnerDeployment template for the legacy actions-runner-controller.
# The controller itself is deployed via infrastructure/controllers.
# Overlays patch the RunnerDeployment with:
#   - metadata.name                -> straw-hat-runners-linux-<env>-<type>
#   - spec.template.spec.image     -> ghcr.io/actions/actions-runner:latest
#   - spec.template.spec.group     -> same (runnerGroup)
#   - spec.replicas
# =============================================================================
---
# Per-type RunnerDeployment template. Overlays patch name/group/image/replicas.
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: runner-deployment  # patched
  namespace: actions-runner-system
spec:
  replicas: 1
  template:
    spec:
      organization: StrawHat-Enterprise
      group: "default"  # patched -> straw-hat-runners-linux-<env>-<type>
      image: ghcr.io/actions/actions-runner:latest  # patched
      labels:
        - self-hosted
        - linux
        - x64
        - community
      dockerEnabled: true
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
