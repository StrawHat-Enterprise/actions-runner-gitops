# =============================================================================
# Community ARC Controller (summerwind/actions-runner-controller)
# =============================================================================
# Installs the legacy actions-runner-controller and its CRDs.
# This must be deployed before any RunnerDeployment resources.
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: actions-runner-controller
      version: "0.23.x"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  targetNamespace: actions-runner-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: flux-system
    - name: external-secrets
      namespace: flux-system
  values:
    authSecret:
      create: false
      name: controller-manager
    # Use PAT synced by External Secrets - the bootstrap will copy it
    # into the controller-manager Secret with the legacy field name
