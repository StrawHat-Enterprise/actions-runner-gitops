# ExternalSecret for community ARC controller authentication
# Syncs the GitHub PAT from Azure Key Vault to the controller-manager secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: controller-manager
  namespace: actions-runner-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: controller-manager
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: github-pat
